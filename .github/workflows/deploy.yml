name: CD Deployment

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    name: Production Deployment Check
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Production Build
        run: npm run build
        env:
          NODE_ENV: production
